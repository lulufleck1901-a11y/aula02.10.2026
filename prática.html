<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="prática.css">
</head>

<body>

    <main class="container">

        <section class="formulario">
            <h1>Cadastro</h1>
            <p>Preencha seus dados abaixo.</p>

            <form id="cadastroForm">

                <label for="nome">Nome Completo</label>
                <input 
                    type="text" 
                    id="nome" 
                    name="nome"
                    placeholder="Digite seu nome completo"
                    required
                >

                <label for="email">E-mail Institucional</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="senha">Senha de Acesso</label>
                <input 
                    type="password" 
                    id="senha" 
                    name="senha"
                    placeholder="Mínimo de 6 caracteres"
                    minlength="6"
                    required
                >

                <label for="confirmaSenha">Confirmação de Senha</label>
                <input 
                    type="password" 
                    id="confirmaSenha" 
                    name="confirmaSenha"
                    placeholder="Digite a senha novamente"
                    required
                >

                <label for="perfil">Perfil Técnico</label>
                <select id="perfil" name="perfil" required>
                    <option value="">Selecione uma área</option>
                    <option value="Redes">Redes</option>
                    <option value="Desenvolvimento">Desenvolvimento</option>
                    <option value="Suporte">Suporte</option>
                </select>

                <div class="termos">
                    <input type="checkbox" id="termos" name="termos">
                    <label for="termos">Aceito os termos de uso</label>
                </div>

                <p id="mensagem"></p>

                <button type="submit">Cadastrar</button>

            </form>
        </section>

        <section class="resultado">
            <h2>Dados cadastrados</h2>

            <div id="saida">
                <p>Seus dados aparecerão aqui após o cadastro.</p>
            </div>
        </section>

    </main>

    <script src="prática.js"></script>

</body>

</html>
